name: Web Build & Deploy

# Builds the Flutter app for the browser (`flutter build web`) and publishes
# it to GitHub Pages. Separate from android-build.yml, which only builds
# APKs — this is the "приложение веб" version, served at
# https://<owner>.github.io/<repo>/ once Pages is switched on (see below).
#
# Split into two jobs on purpose:
#  - `build` runs on every push and pull request, same as android-build.yml —
#    it's the actual CI signal (analyze/test/build), and doesn't touch the
#    Pages API at all, so it works fine before Pages is even turned on.
#  - `deploy` only runs for a push to main, and is the only job that needs
#    Pages-specific permissions — a red PR build never gets a chance to
#    publish anything.
#
# One-time setup required (can't be done from a workflow file): open this
# repo's Settings → Pages → Build and deployment → Source, and pick
# "GitHub Actions". Until that's set, `build` still passes on every PR —
# only `deploy` has nothing to publish to.
on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/web-deploy.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # --base-href matches this project-site path (github.io/<repo>/) so
      # the built index.html resolves its assets correctly once deployed.
      - name: Build web (release)
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: app/build/web

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Only one Pages deployment at a time; let an in-flight one finish
    # rather than cancel it mid-publish.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
