name: Android Build

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build-apk:
    name: Build debug & release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK (unsigned)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build debug APK
        run: flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: apteka_opt-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apteka_opt-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
